<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="YYMojo - 让喜欢的角色，触手可及。AI手办创作平台">
    <title>YYMojo - 让喜欢的角色，触手可及</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #8b5cf6;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --bg-light: #f9fafb;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            width: 100%;
            max-width: 100%;
            padding: 0 16px;
            margin: 0 auto;
        }

        /* Header Styles */
        .header {
            text-align: center;
            padding: 32px 0 24px;
            width: 100%;
        }

        .logo {
            font-size: clamp(24px, 6vw, 32px);
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .tagline {
            font-size: clamp(16px, 4.5vw, 20px);
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .hero-subtitle {
            font-size: clamp(14px, 3.8vw, 16px);
            color: var(--text-secondary);
            width: 100%;
            margin: 0 auto;
            line-height: 1.5;
            font-weight: 500;
        }

        /* App Links Section */
        .app-links {
            padding: 28px 0;
            width: 100%;
        }

        .section-title {
            text-align: center;
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
            width: 100%;
        }

        .platform-grid {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .platform-card {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            width: 100%;
            border: 2px solid transparent;
        }

        .platform-card:hover,
        .platform-card:focus {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .platform-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .android .platform-icon {
            color: #3ddc84;
        }

        .ios .platform-icon {
            color: #007aff;
        }

        .harmony .platform-icon {
            color: #ff6a00;
        }

        .platform-name {
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .platform-desc {
            font-size: clamp(12px, 3.2vw, 14px);
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Core Features Section */
        .core-features {
            padding: 28px 0;
            background: var(--white);
            width: 100%;
        }

        .feature-list {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            padding: 16px 0;
            border-bottom: 1px solid #f1f5f9;
            width: 100%;
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .feature-text {
            flex: 1;
            min-width: 0;
        }

        .feature-title {
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .feature-desc {
            font-size: clamp(12px, 3.2vw, 14px);
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 28px 0 36px;
            color: var(--text-secondary);
            font-size: clamp(12px, 3vw, 13px);
            width: 100%;
            font-weight: 500;
        }

        /* Responsive Design - Mobile First */
        @media (max-width: 320px) {
            .container {
                padding: 0 12px;
            }
            
            .header {
                padding: 28px 0 20px;
            }
            
            .platform-grid {
                gap: 10px;
            }
            
            .platform-card {
                padding: 14px;
                min-height: 90px;
            }
            
            .tagline {
                font-size: 18px;
            }
        }

        @media (min-width: 321px) and (max-width: 375px) {
            .container {
                padding: 0 14px;
            }
            
            .platform-grid {
                gap: 12px;
            }
        }

        @media (min-width: 376px) and (max-width: 414px) {
            .container {
                padding: 0 16px;
            }
            
            .platform-grid {
                gap: 14px;
            }
        }

        @media (min-width: 415px) and (max-width: 767px) {
            .container {
                padding: 0 20px;
            }
            
            .platform-grid {
                gap: 16px;
            }
            
            .platform-card {
                padding: 18px;
                min-height: 110px;
            }
        }

        /* Tablet and Desktop */
        @media (min-width: 768px) {
            html {
                font-size: 17px;
            }
            
            .container {
                max-width: 480px;
                padding: 0 24px;
            }
            
            .header {
                padding: 40px 0 32px;
            }
            
            .platform-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 18px;
                max-width: 480px;
            }
            
            .platform-card {
                padding: 20px;
                min-height: 130px;
            }
            
            .tagline {
                font-size: 24px;
            }
            
            .section-title {
                font-size: 22px;
            }
        }

        /* Large screens */
        @media (min-width: 1024px) {
            html {
                font-size: 18px;
            }
            
            .container {
                max-width: 520px;
                padding: 0 32px;
            }
            
            .platform-grid {
                max-width: 520px;
            }
        }

        /* Safe area handling for iOS */
        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Ensure no horizontal scroll */
        body, .container {
            overflow-x: hidden;
        }
        
        /* Focus styles for accessibility */
        .platform-card:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">YYMojo</div>
            <h1 class="tagline">让喜欢的角色，<br>触手可及</h1>
            <p class="hero-subtitle">首个 AI 手办创作平台。在线创造角色，线下拥有专属伙伴</p>
        </header>

        <!-- App Download Links -->
        <section class="app-links">
            <h2 class="section-title">立即下载APP</h2>
            <div class="platform-grid">
                <a href="#" class="platform-card android" id="android-link" tabindex="0">
                    <div class="platform-icon">ANDROID</div>
                    <div class="platform-name">Android</div>
                    <div class="platform-desc">应用商店下载</div>
                </a>
                
                <a href="#" class="platform-card ios" id="ios-link" tabindex="0">
                    <div class="platform-icon">IOS</div>
                    <div class="platform-name">iOS</div>
                    <div class="platform-desc">App Store下载</div>
                </a>
                
                <a href="#" class="platform-card harmony" id="harmony-link" tabindex="0">
                    <div class="platform-icon">HARMONY</div>
                    <div class="platform-name">鸿蒙</div>
                    <div class="platform-desc">华为应用市场</div>
                </a>
            </div>
        </section>

        <!-- Core Features -->
        <section class="core-features">
            <h2 class="section-title">核心功能</h2>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon">🎨</div>
                    <div class="feature-text">
                        <div class="feature-title">自由创作</div>
                        <div class="feature-desc">无需代码，在 Studio 里像搭积木一样组合角色的形象、性格、声音和技能</div>
                    </div>
                </div>
                
                <div class="feature-item">
                    <div class="feature-icon">💬</div>
                    <div class="feature-text">
                        <div class="feature-title">角色陪伴</div>
                        <div class="feature-desc">自由聊天、趣味吐槽、情绪共情。闲置时，它也会主动和你打招呼</div>
                    </div>
                </div>
                
                <div class="feature-item">
                    <div class="feature-icon">🖨️</div>
                    <div class="feature-text">
                        <div class="feature-title">实体手办</div>
                        <div class="feature-desc">磁吸连接，线上角色在桌面上醒来。一个底座，玩遍所有角色</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 YYMojo · AI 手办创作平台</p>
            <p>让喜欢的角色，触手可及</p>
        </footer>
    </div>

    <script>
        // 预留超链接入口配置
        document.addEventListener('DOMContentLoaded', function() {
            // 这里可以配置实际的下载链接
            const links = {
                android: 'http://download.yymojo.com/zvyjd61x', // Android下载链接
                ios: '#',     // 替换为实际的iOS下载链接  
                harmony: '#'  // 替换为实际的鸿蒙下载链接
            };
            
            document.getElementById('android-link').href = links.android;
            document.getElementById('ios-link').href = links.ios;
            document.getElementById('harmony-link').href = links.harmony;
            
            // 添加键盘支持
            document.querySelectorAll('.platform-card').forEach(card => {
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });
        });

        // 响应式处理
        function handleResize() {
            const isMobile = window.innerWidth <= 768;
            document.body.classList.toggle('mobile-view', isMobile);
        }
        
        window.addEventListener('resize', handleResize);
        handleResize(); // 初始化
        
        // 防止页面缩放
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
