<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="YYMojo - 打开AI潮玩新世界。AI手办创作平台">
    <title>YYMojo - 打开AI潮玩新世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            position: relative;
        }

        /* Use the exact background image */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('yymojo-background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        .content-overlay {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
            width: 100%;
        }

        /* Download Buttons - positioned over the existing buttons in the image */
        .download-buttons {
            display: grid;
            gap: 20px;
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
        }

        .download-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .download-button:hover,
        .download-button:focus {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .platform-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            color: white;
        }

        .android .platform-icon {
            background: linear-gradient(135deg, #3ddc84 0%, #2ecc71 100%);
        }

        .ios .platform-icon {
            background: linear-gradient(135deg, #007aff 0%, #0056b3 100%);
        }

        .harmony .platform-icon {
            background: linear-gradient(135deg, #ff6a00 0%, #ff4500 100%);
        }

        .platform-name {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            color: white;
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Responsive Design */
        @media (max-width: 320px) {
            .download-button {
                padding: 16px 12px;
                min-height: 110px;
            }
            
            .platform-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .platform-name {
                font-size: 18px;
            }
        }

        @media (min-width: 321px) and (max-width: 375px) {
            .download-button {
                padding: 18px 14px;
                min-height: 115px;
            }
        }

        @media (min-width: 376px) and (max-width: 414px) {
            .download-button {
                padding: 20px 16px;
                min-height: 120px;
            }
        }

        @media (min-width: 415px) and (max-width: 767px) {
            .download-button {
                padding: 22px 18px;
                min-height: 125px;
            }
            
            .platform-icon {
                width: 55px;
                height: 55px;
                font-size: 26px;
            }
        }

        @media (min-width: 768px) {
            html {
                font-size: 18px;
            }
            
            .download-buttons {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
                max-width: 500px;
            }
            
            .download-button {
                padding: 24px 20px;
                min-height: 140px;
            }
            
            .platform-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            
            .platform-name {
                font-size: 24px;
            }
        }

        /* Safe area handling */
        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Focus styles for accessibility */
        .download-button:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <!-- Exact background image -->
    <div class="background-container"></div>
    
    <!-- Overlay content with download buttons -->
    <div class="content-overlay">
        <div class="download-buttons">
            <a href="http://download.yymojo.com/zvyjd61x" class="download-button android" id="android-link" tabindex="0">
                <div class="platform-icon">ANDROID</div>
                <div class="platform-name">Android</div>
            </a>
            
            <a href="#" class="download-button ios" id="ios-link" tabindex="0">
                <div class="platform-icon">IOS</div>
                <div class="platform-name">iOS</div>
            </a>
            
            <a href="#" class="download-button harmony" id="harmony-link" tabindex="0">
                <div class="platform-icon">HARMONY</div>
                <div class="platform-name">鸿蒙</div>
            </a>
        </div>
    </div>

    <script>
        // 添加键盘支持
        document.querySelectorAll('.download-button').forEach(button => {
            button.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });
    </script>
</body>
</html>
