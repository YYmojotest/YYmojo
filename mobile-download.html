<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="YYMojo - AI手办创作平台 | 一句话生成形象 · 注入会聊天的灵魂 · 打印成摆在桌上的它">
    <title>YYMojo - 移动端下载</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #8b5cf6;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --bg-light: #f9fafb;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            width: 100%;
            max-width: 100%;
            padding: 0 16px;
            margin: 0 auto;
        }

        /* Header Styles */
        .header {
            text-align: center;
            padding: 32px 0 24px;
            width: 100%;
        }

        .logo {
            font-size: clamp(24px, 6vw, 32px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .tagline {
            font-size: clamp(14px, 4vw, 16px);
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .hero-title {
            font-size: clamp(20px, 6vw, 26px);
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
            width: 100%;
        }

        .hero-subtitle {
            font-size: clamp(12px, 3.5vw, 14px);
            color: var(--text-secondary);
            width: 100%;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* App Links Section */
        .app-links {
            padding: 28px 0;
            width: 100%;
        }

        .section-title {
            text-align: center;
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
            width: 100%;
        }

        .platform-grid {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .platform-card {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            width: 100%;
        }

        .platform-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .platform-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .android .platform-icon {
            color: #3ddc84;
        }

        .ios .platform-icon {
            color: #007aff;
        }

        .harmony .platform-icon {
            color: #ff6a00;
        }

        .platform-name {
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .platform-desc {
            font-size: clamp(10px, 3vw, 12px);
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Features Section */
        .features {
            padding: 28px 0;
            background: var(--white);
            width: 100%;
        }

        .feature-list {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px solid #f3f4f6;
            width: 100%;
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .feature-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            color: white;
            font-size: 12px;
        }

        .feature-text {
            flex: 1;
            min-width: 0;
        }

        .feature-title {
            font-size: clamp(13px, 3.8vw, 15px);
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .feature-desc {
            font-size: clamp(11px, 3.2vw, 13px);
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 28px 0 36px;
            color: var(--text-secondary);
            font-size: clamp(11px, 3vw, 12px);
            width: 100%;
        }

        /* Responsive Design - Mobile First */
        @media (max-width: 320px) {
            .container {
                padding: 0 12px;
            }
            
            .header {
                padding: 28px 0 20px;
            }
            
            .platform-grid {
                gap: 10px;
            }
            
            .platform-card {
                padding: 14px;
                min-height: 90px;
            }
            
            .hero-title {
                font-size: 18px;
            }
        }

        @media (min-width: 321px) and (max-width: 375px) {
            .container {
                padding: 0 14px;
            }
            
            .platform-grid {
                gap: 12px;
            }
        }

        @media (min-width: 376px) and (max-width: 414px) {
            .container {
                padding: 0 16px;
            }
            
            .platform-grid {
                gap: 14px;
            }
        }

        @media (min-width: 415px) and (max-width: 767px) {
            .container {
                padding: 0 20px;
            }
            
            .platform-grid {
                gap: 16px;
            }
            
            .platform-card {
                padding: 18px;
                min-height: 110px;
            }
        }

        /* Tablet and Desktop */
        @media (min-width: 768px) {
            html {
                font-size: 17px;
            }
            
            .container {
                max-width: 480px;
                padding: 0 24px;
            }
            
            .header {
                padding: 40px 0 32px;
            }
            
            .platform-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 18px;
                max-width: 480px;
            }
            
            .platform-card {
                padding: 20px;
                min-height: 130px;
            }
            
            .hero-title {
                font-size: 28px;
            }
            
            .section-title {
                font-size: 22px;
            }
        }

        /* Large screens */
        @media (min-width: 1024px) {
            html {
                font-size: 18px;
            }
            
            .container {
                max-width: 520px;
                padding: 0 32px;
            }
            
            .platform-grid {
                max-width: 520px;
            }
        }

        /* Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* Safe area handling for iOS */
        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Prevent zoom on input focus */
        input, textarea, select, button {
            font-size: 16px;
        }

        /* Ensure no horizontal scroll */
        body, .container {
            overflow-x: hidden;
        }
    </style>
</head>
<body>

        <!-- App Download Links -->

                <div class="feature-item">

                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 YYMojo. 保留所有权利。</p>
            <p>AI手办创作平台</p>
        </footer>
    </div>

    <script>
        // 预留超链接入口配置
        document.addEventListener('DOMContentLoaded', function() {
            // 这里可以配置实际的下载链接
            const links = {
                android: 'http://download.yymojo.com/zvyjd61x', // Android下载链接
                ios: '#',     // 替换为实际的iOS下载链接  
                harmony: '#'  // 替换为实际的鸿蒙下载链接
            };
            
            document.getElementById('android-link').href = links.android;
            document.getElementById('ios-link').href = links.ios;
            document.getElementById('harmony-link').href = links.harmony;
            
            // 添加点击事件跟踪（可选）
            document.querySelectorAll('.platform-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const platform = this.classList.contains('android') ? 'android' : 
                                   this.classList.contains('ios') ? 'ios' : 'harmony';
                    console.log(`用户点击了${platform}下载链接`);
                    // 可以在这里添加分析代码
                });
            });
        });

        // 响应式处理
        function handleResize() {
            const isMobile = window.innerWidth <= 768;
            document.body.classList.toggle('mobile-view', isMobile);
            
            // 强制重新计算布局
            document.body.style.display = 'none';
            setTimeout(() => {
                document.body.style.display = '';
            }, 10);
        }
        
        window.addEventListener('resize', handleResize);
        handleResize(); // 初始化
        
        // 处理深色模式（如果需要）
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // 可以添加深色模式样式
        }
        
        // 防止页面缩放
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
