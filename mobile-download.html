<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="YYMojo - 让喜欢的角色，触手可及。AI手办创作平台">
    <title>YYMojo - 让喜欢的角色，触手可及</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --card-bg: #1e293b;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            --border-radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 100%;
            padding: 0 16px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Header Styles */
        .header {
            text-align: center;
            padding: 20px 0 30px;
            width: 100%;
            margin-bottom: 20px;
        }

        .logo {
            font-size: clamp(32px, 8vw, 40px);
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(102, 102, 241, 0.3);
        }

        .tagline {
            font-size: clamp(20px, 6vw, 26px);
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
            color: var(--text-primary);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .hero-subtitle {
            font-size: clamp(14px, 3.8vw, 16px);
            color: var(--text-secondary);
            width: 100%;
            margin: 0 auto;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Simplified Download Buttons */
        .download-section {
            width: 100%;
            max-width: 100%;
            padding: 0 16px;
        }

        .download-buttons {
            display: grid;
            gap: 20px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .download-button {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px 16px;
            text-align: center;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            width: 100%;
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .download-button:hover,
        .download-button:focus {
            transform: translateY(-6px) scale(1.03);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .platform-icon-large {
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 16px;
            color: white;
        }

        .android .platform-icon-large {
            background: linear-gradient(135deg, #3ddc84 0%, #2ecc71 100%);
        }

        .ios .platform-icon-large {
            background: linear-gradient(135deg, #007aff 0%, #0056b3 100%);
        }

        .harmony .platform-icon-large {
            background: linear-gradient(135deg, #ff6a00 0%, #ff4500 100%);
        }

        .platform-name-large {
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 0 20px;
            color: var(--text-secondary);
            font-size: clamp(12px, 3vw, 13px);
            width: 100%;
            font-weight: 500;
            margin-top: auto;
        }

        /* Responsive Design - Mobile First */
        @media (max-width: 320px) {
            .container {
                padding: 0 12px;
            }
            
            .header {
                padding: 16px 0 24px;
            }
            
            .download-button {
                padding: 20px 12px;
                min-height: 130px;
            }
            
            .platform-icon-large {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            
            .platform-name-large {
                font-size: 18px;
            }
        }

        @media (min-width: 321px) and (max-width: 375px) {
            .container {
                padding: 0 14px;
            }
            
            .download-button {
                padding: 22px 14px;
                min-height: 135px;
            }
        }

        @media (min-width: 376px) and (max-width: 414px) {
            .container {
                padding: 0 16px;
            }
            
            .download-button {
                padding: 24px 16px;
                min-height: 140px;
            }
        }

        @media (min-width: 415px) and (max-width: 767px) {
            .container {
                padding: 0 20px;
            }
            
            .download-button {
                padding: 26px 18px;
                min-height: 145px;
            }
            
            .platform-icon-large {
                width: 65px;
                height: 65px;
                font-size: 30px;
            }
        }

        /* Tablet and Desktop */
        @media (min-width: 768px) {
            html {
                font-size: 18px;
            }
            
            .container {
                max-width: 500px;
                padding: 0 24px;
            }
            
            .header {
                padding: 24px 0 36px;
            }
            
            .download-buttons {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
                max-width: 500px;
            }
            
            .download-button {
                padding: 28px 20px;
                min-height: 160px;
            }
            
            .platform-icon-large {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }
            
            .platform-name-large {
                font-size: 24px;
            }
            
            .tagline {
                font-size: 30px;
            }
        }

        /* Large screens */
        @media (min-width: 1024px) {
            html {
                font-size: 20px;
            }
            
            .container {
                max-width: 550px;
                padding: 0 32px;
            }
            
            .download-buttons {
                max-width: 550px;
            }
            
            .download-button {
                padding: 32px 24px;
                min-height: 170px;
            }
            
            .platform-icon-large {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }
        }

        /* Safe area handling for iOS */
        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Ensure no horizontal scroll */
        body, .container {
            overflow-x: hidden;
        }
        
        /* Glowing effect for logo */
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(102, 102, 241, 0.3); }
            50% { text-shadow: 0 0 30px rgba(102, 102, 241, 0.6); }
        }
        
        .logo {
            animation: glow 3s ease-in-out infinite;
        }
        
        /* Focus styles for accessibility */
        .download-button:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }
        
        /* Hover glow effect */
        .download-button:hover .platform-icon-large {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">YYMojo</div>
            <h1 class="tagline">让喜欢的角色，<br>触手可及</h1>
            <p class="hero-subtitle">首个 AI 手办创作平台</p>
        </header>

        <!-- Simplified Download Buttons Only -->
        <section class="download-section">
            <div class="download-buttons">
                <a href="http://download.yymojo.com/zvyjd61x" class="download-button android" id="android-link" tabindex="0">
                    <div class="platform-icon-large">ANDROID</div>
                    <div class="platform-name-large">Android</div>
                </a>
                
                <a href="#" class="download-button ios" id="ios-link" tabindex="0">
                    <div class="platform-icon-large">IOS</div>
                    <div class="platform-name-large">iOS</div>
                </a>
                
                <a href="#" class="download-button harmony" id="harmony-link" tabindex="0">
                    <div class="platform-icon-large">HARMONY</div>
                    <div class="platform-name-large">鸿蒙</div>
                </a>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 YYMojo</p>
        </footer>
    </div>

    <script>
        // 添加键盘支持
        document.querySelectorAll('.download-button').forEach(button => {
            button.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });
    </script>
</body>
</html>
