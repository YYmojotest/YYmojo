<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="YYMojo - 打开AI潮玩新世界。AI手办创作平台">
    <title>YYMojo - 打开AI潮玩新世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            position: relative;
            background: black;
        }

        /* 全新设计的YYMojo品牌背景 */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* 渐变背景层 */
        .gradient-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                #4c1d95 0%,      /* 深紫 */
                #6366f1 30%,     /* YYMojo主色 */
                #8b5cf6 60%,     /* YYMojo亮色 */
                #a855f7 100%);   /* 亮紫 */
        }

        /* 几何图形装饰 */
        .geometric-shapes {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60%;
            opacity: 0.3;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
        }

        .shape-1 { top: 10%; left: 15%; width: 120px; height: 120px; }
        .shape-2 { top: 25%; right: 20%; width: 80px; height: 80px; }
        .shape-3 { top: 40%; left: 25%; width: 60px; height: 60px; }
        .shape-4 { top: 15%; right: 35%; width: 40px; height: 40px; }
        .shape-5 { top: 35%; left: 40%; width: 30px; height: 30px; }

        /* AI光效元素 */
        .ai-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: radial-gradient(circle at center, 
                rgba(139, 92, 246, 0.4) 0%, 
                transparent 70%);
            opacity: 0.6;
        }

        /* 品牌标识区域 */
        .brand-section {
            position: absolute;
            top: 20%;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 1;
        }

        .brand-logo {
            font-size: 48px;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 16px;
            background: linear-gradient(45deg, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-slogan {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            max-width: 300px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* 底部渐变遮罩 - 为按钮区域提供对比度 */
        .bottom-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(to top, 
                rgba(0, 0, 0, 0.8) 0%, 
                rgba(0, 0, 0, 0.4) 50%, 
                transparent 100%);
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 60px;
            width: 100%;
        }

        /* Enhanced Download Buttons */
        .download-buttons {
            display: flex;
            gap: 24px;
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
        }

        .download-button {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 28px 16px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            width: 100%;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .download-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(45deg, 
                rgba(255, 255, 255, 0.2), 
                rgba(255, 255, 255, 0.1), 
                rgba(255, 255, 255, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .download-button:hover,
        .download-button:focus {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .download-button:active {
            transform: translateY(-4px) scale(1.01);
            transition: all 0.1s ease;
        }

        .platform-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            border-radius: 20px;
            color: white;
            opacity: 0.95;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .download-button:hover .platform-icon {
            transform: scale(1.1);
            opacity: 1;
        }

        .android .platform-icon {
            background: linear-gradient(135deg, #3ddc84 0%, #2ecc71 100%);
            box-shadow: 0 4px 16px rgba(61, 220, 132, 0.4);
        }

        .ios .platform-icon {
            background: linear-gradient(135deg, #007aff 0%, #0056b3 100%);
            box-shadow: 0 4px 16px rgba(0, 122, 255, 0.4);
        }

        .harmony .platform-icon {
            background: linear-gradient(135deg, #ff6a00 0%, #ff4500 100%);
            box-shadow: 0 4px 16px rgba(255, 106, 0, 0.4);
        }

        .platform-name {
            font-size: 22px;
            font-weight: 800;
            color: white;
            line-height: 1.3;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            opacity: 0.98;
            letter-spacing: -0.5px;
        }

        /* Responsive Design */
        @media (max-width: 320px) {
            .brand-logo { font-size: 40px; }
            .brand-slogan { font-size: 18px; }
            .download-button {
                padding: 24px 12px;
                min-height: 140px;
                border-radius: 22px;
            }
            .platform-icon {
                width: 60px;
                height: 60px;
                font-size: 24px;
                margin-bottom: 12px;
                border-radius: 16px;
            }
            .platform-name { font-size: 20px; }
        }

        @media (min-width: 321px) and (max-width: 375px) {
            .brand-logo { font-size: 44px; }
            .brand-slogan { font-size: 19px; }
            .download-button {
                padding: 26px 14px;
                min-height: 145px;
            }
            .platform-icon { width: 66px; height: 66px; }
        }

        @media (min-width: 376px) and (max-width: 414px) {
            .brand-logo { font-size: 48px; }
            .brand-slogan { font-size: 20px; }
            .download-button {
                padding: 28px 16px;
                min-height: 150px;
            }
        }

        @media (min-width: 415px) and (max-width: 767px) {
            .brand-logo { font-size: 52px; }
            .brand-slogan { font-size: 22px; }
            .download-button {
                padding: 30px 18px;
                min-height: 155px;
            }
            .platform-icon {
                width: 76px;
                height: 76px;
                font-size: 30px;
            }
            .platform-name { font-size: 24px; }
        }

        @media (min-width: 768px) {
            .brand-logo { font-size: 56px; }
            .brand-slogan { font-size: 24px; }
            .download-buttons {
                flex-direction: column;
                gap: 28px;
                max-width: 340px;
            }
            .download-button {
                padding: 32px 20px;
                min-height: 165px;
                border-radius: 28px;
            }
            .platform-icon {
                width: 80px;
                height: 80px;
                font-size: 32px;
                border-radius: 22px;
            }
            .platform-name { font-size: 26px; }
        }

        /* Safe area handling */
        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Focus styles for accessibility */
        .download-button:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.8);
            outline-offset: 4px;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
        }

        /* Loading state animation */
        .download-button.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .download-button.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 动画效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .brand-section {
            animation: float 6s ease-in-out infinite;
        }

        .shape {
            animation: pulse 4s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- 全新YYMojo品牌背景 -->
    <div class="background-container">
        <div class="gradient-bg"></div>
        <div class="ai-glow"></div>
        <div class="geometric-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
        <div class="brand-section">
            <div class="brand-logo">YYMojo</div>
            <div class="brand-slogan">打开AI潮玩新世界</div>
        </div>
        <div class="bottom-overlay"></div>
    </div>
    
    <!-- Overlay content with enhanced download buttons -->
    <div class="content-overlay">
        <div class="download-buttons">
            <a href="http://download.yymojo.com/zvyjd61x" class="download-button android" id="android-link" tabindex="0">
                <div class="platform-icon">ANDROID</div>
                <div class="platform-name">Android</div>
            </a>
            
            <a href="#" class="download-button ios" id="ios-link" tabindex="0">
                <div class="platform-icon">IOS</div>
                <div class="platform-name">iOS</div>
            </a>
            
            <a href="#" class="download-button harmony" id="harmony-link" tabindex="0">
                <div class="platform-icon">HARMONY</div>
                <div class="platform-name">鸿蒙</div>
            </a>
        </div>
    </div>

    <script>
        // Enhanced keyboard support with loading states
        document.querySelectorAll('.download-button').forEach(button => {
            button.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
            
            // Add loading state for Android link
            if (button.id === 'android-link') {
                button.addEventListener('click', function(e) {
                    // Add loading state
                    this.classList.add('loading');
                    
                    // Remove loading state after a short delay
                    setTimeout(() => {
                        this.classList.remove('loading');
                    }, 2000);
                });
            }
            
            // iOS and Harmony - show coming soon message
            if (button.id === 'ios-link' || button.id === 'harmony-link') {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('敬请期待！即将上线');
                });
            }
        });
        
        // Smooth entrance animation
        window.addEventListener('load', () => {
            const buttonsContainer = document.querySelector('.download-buttons');
            const brandSection = document.querySelector('.brand-section');
            
            if (buttonsContainer) {
                buttonsContainer.style.opacity = '0';
                buttonsContainer.style.transform = 'translateY(30px)';
                buttonsContainer.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                
                setTimeout(() => {
                    buttonsContainer.style.opacity = '1';
                    buttonsContainer.style.transform = 'translateY(0)';
                }, 600);
            }
            
            if (brandSection) {
                brandSection.style.opacity = '0';
                brandSection.style.transform = 'translateY(20px)';
                brandSection.style.transition = 'opacity 1s ease, transform 1s ease';
                
                setTimeout(() => {
                    brandSection.style.opacity = '1';
                    brandSection.style.transform = 'translateY(0)';
                }, 300);
            }
        });
    </script>
</body>
</html>
